<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office Task Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="banner" id="banner" hidden></div>

  <header>
    <div>
      <div class="date" id="date"></div>
      <h1>Office Task Board</h1>
    </div>
    <div class="prog">
      <div class="prog-top"><span id="count">0 of 0 done</span><span id="pct">0%</span></div>
      <div class="bar"><i id="fill"></i></div>
    </div>
  </header>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Search tasks" aria-label="Search tasks">
    <label class="toggle"><input id="hideDone" type="checkbox"> Hide done</label>
    <button class="btn primary" id="newBtn" type="button">+ New task</button>
  </div>
  <div class="chips" id="chips"></div>

  <div id="empty" class="empty" hidden>
    <h2>No tasks yet</h2>
    <p>Add your first task, or load the tasks from your Task Sheet.</p>
    <button class="btn" id="seedBtn" type="button">Load my starter tasks</button>
  </div>

  <section id="prioWrap" hidden>
    <div class="label">Do first</div>
    <div class="prio" id="prio"></div>
  </section>

  <div class="grid" id="groups"></div>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">New task</h2>
    <label>Task <input id="fTitle" required maxlength="140" autocomplete="off"></label>
    <label>Note <textarea id="fNote" rows="3" maxlength="500"></textarea></label>
    <div class="row">
      <label>Section <input id="fSection" list="sections" required maxlength="40" autocomplete="off"></label>
      <label>Due date <input id="fDue" type="date"></label>
    </div>
    <datalist id="sections"></datalist>
    <label class="toggle"><input id="fPrio" type="checkbox"> Do first (pin to the top)</label>
    <div class="actions">
      <button class="btn" id="cancel" type="button">Cancel</button>
      <button class="btn primary" type="submit">Save</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
